<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Letter For You ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="page3.css">
</head>

<body>

    <!-- Floating Background -->
    <div class="background"></div>

    <!-- Floating Hearts -->
    <div id="hearts"></div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Envelope Section -->
    <div class="envelope-container" id="envelopeContainer">

        <div class="envelope" id="envelope">

            <div class="front"></div>

            <div class="letter">

                <h2>A Letter Just For You 💌</h2>

                <p>
                    Click to Open ❤️
                </p>

            </div>

        </div>

    </div>

    <!-- Letter Card -->
    <div class="card hidden" id="letterCard">

        <img src="Hello Kitty.jpg" class="kitty">

        <h1>My Letter For You 💖</h1>

        <p id="typingText"></p>

        <div class="quote-box">

            <p class="quote">
                "Every moment with you feels like magic."
            </p>

        </div>

        <button id="nextBtn">

            Next Surprise ❤️

        </button>
        <button onclick="window.location.href='page5.html'">
    next ❤️
</button>

    </div>

    <!-- Background Music -->
    <audio id="music" loop>

        <source src="ishq.mp3" type="audio/mpeg">

    </audio>

    <script src="page3.js"></script>

</body>
</html>
