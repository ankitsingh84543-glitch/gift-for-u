<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
background-size:400% 400%;
animation:bg 12s infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:420px;
padding:35px;
background:rgba(255,255,255,.25);
backdrop-filter:blur(18px);
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25);
animation:pop .8s;
}

@keyframes pop{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

img{
width:220px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

h1{
color:white;
margin-bottom:15px;
}

p{
color:white;
font-size:18px;
line-height:1.8;
margin-bottom:20px;
}

button{
padding:15px 35px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
background:#ff2e63;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

.heart{
position:fixed;
font-size:22px;
animation:fly 5s linear infinite;
opacity:.7;
}

@keyframes fly{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-120vh);
}
}
</style>

</head>

<body>

<div class="card">

<img src="hello kitty.jpg" alt="hello kitty">

<h1>Just For You ❤️</h1>

<p>
You make my days brighter 🌸<br>
Your smile is my favorite view 😊<br>
Every moment with you feels magical ✨<br>
Thank you for being so special 💖
</p>

<button onclick="location.href='page3.html'">
Next ➜
</button>

</div>

<script>

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(3+Math.random()*4)+"s";

heart.style.fontSize=(15+Math.random()*20)+"px";

document.body.appendChild(heart);

}

</script>

</body>
</html>
